// Initial restored VR configuration.
// Render the HUD into each eye before compositor submission.  Direct overlay
// composition will be enabled after the zero-copy texture bridge is installed.
vr_hud_never_overlay 1
vr_render_hud_in_world 1
vr_activate_default 1
// Preserve the user's archived render scale and bridge choice across activation.
// Set openvr_render_scale / openvr_gpu_bridge before vr_activate.
openvr_copy_interval 1
